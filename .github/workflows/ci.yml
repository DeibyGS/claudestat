name: CI

on:
  push:
    branches: [main, 'release/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict)
        run: npx tsc --noEmit

  test:
    name: Test (${{ matrix.os }})
    needs: [lint]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build
        run: npm run build

      - name: Check dashboard build freshness
        run: |
          node -e "
          const fs = require('fs'), path = require('path');
          function latestMtime(dir) {
            let t = 0;
            function walk(d) { for (const e of fs.readdirSync(d,{withFileTypes:!0})) { const f = path.join(d,e.name); if (e.isDirectory()) walk(f); else { const s = fs.statSync(f); if (s.mtimeMs > t) t = s.mtimeMs; } } }
            try { walk(dir); } catch { return 0; } return t;
          }
          const src = latestMtime('dashboard/src'), dist = latestMtime('dashboard/dist');
          if (!dist) { console.error('❌ dashboard/dist/ is empty or missing'); process.exit(1); }
          if (src > dist) { console.error('❌ dashboard/dist/ is stale — source files are newer than built output'); process.exit(1); }
          console.log('✅ dashboard build is up to date');
          "

      - name: Test
        run: npm test

  publish-check:
    name: Publish dry-run
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard
      - name: Validate NPM_TOKEN secret
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
              echo "❌ NPM_TOKEN is not set in repo secrets"
              exit 1
            fi
            echo "✅ NPM_TOKEN is set"
      - name: Dry-run publish (packaging check)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm publish --dry-run

  badge:
    name: Tests badge
    needs: [publish-check]
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Generate badge JSON artifact
        run: |
          mkdir -p badges
          cat > badges/tests.json << 'EOF'
          {
            "schemaVersion": 1,
            "label": "tests",
            "message": "passing",
            "color": "brightgreen"
          }
          EOF

      - uses: actions/upload-artifact@v5
        with:
          name: tests-badge
          path: badges/
