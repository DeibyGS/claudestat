name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  gate:
    name: Release gate (version, changelog, tests, build)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      - name: package.json matches the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$VERSION  package.json=$PKG"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::package.json ($PKG) does not match the tag ($VERSION)"
            exit 1
          fi

      - name: package-lock.json is in sync
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LOCK="$(node -p "require('./package-lock.json').version")"
          LOCK_PKG="$(node -p "require('./package-lock.json').packages[''].version")"
          echo "package.json=$VERSION  lock=$LOCK  lock.packages['']=$LOCK_PKG"
          if [ "$LOCK" != "$VERSION" ] || [ "$LOCK_PKG" != "$VERSION" ]; then
            echo "::error::package-lock.json ($LOCK / $LOCK_PKG) does not match package.json ($VERSION)"
            exit 1
          fi

      - name: CHANGELOG has an entry for the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

      - name: Version is not already on npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@statforge/claudestat@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$VERSION is already published on npm — bump package.json first"
            exit 1
          fi
          echo "$VERSION is free to publish"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack the artifact
        run: |
          npm pack --json > npm-pack.json
          node -e "const p=require('./npm-pack.json')[0];console.log('filename='+p.filename);console.log('integrity='+p.integrity)"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-pack-manifest
          path: npm-pack.json

  npm:
    name: Publish to npm
    needs: gate
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build
        run: npm run build

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          if [ "$(printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::trusted publishing requires npm >= 11.5.1, found $NPM_VERSION"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  binary:
    name: Build binary (${{ matrix.target.name }})
    needs: gate
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: macos-arm64, os: macos-latest, bun-target: bun-darwin-arm64 }
          - { name: macos-x64,   os: macos-latest, bun-target: bun-darwin-x64 }
          - { name: linux-x64,   os: ubuntu-latest, bun-target: bun-linux-x64 }
          - { name: linux-arm64, os: ubuntu-latest, bun-target: bun-linux-arm64 }
          - { name: win-x64,     os: windows-latest, bun-target: bun-windows-x64 }

    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build TypeScript + dashboard
        run: npm run build

      - name: Copy dashboard dist
        run: |
          mkdir -p dist/dashboard
          cp -r dashboard/dist/* dist/dashboard/
        shell: bash

      - name: Build binary with Bun
        run: |
          mkdir -p bin
          bun build --compile \
            --target ${{ matrix.target.bun-target }} \
            --outfile ./bin/claudestat-${{ matrix.target.name }} \
            ./dist/index.js
        shell: bash

      - name: Verify binary exists
        shell: bash
        run: |
          binary_path="./bin/claudestat-${{ matrix.target.name }}"
          if [ "${{ matrix.target.os }}" = "windows-latest" ]; then
            binary_path="${binary_path}.exe"
          fi
          if [ ! -f "$binary_path" ]; then
            echo "❌ Binary not found: $binary_path"
            exit 1
          fi
          file_size=$(wc -c < "$binary_path")
          echo "✅ Binary size: $file_size bytes"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudestat-${{ matrix.target.name }}
          path: ./bin/claudestat-${{ matrix.target.name }}*

  verify:
    name: Verify npm version matches the tag
    needs: [gate, npm]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: npm latest equals the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISHED=""
          LATEST=""
          for i in $(seq 1 12); do
            PUBLISHED="$(npm view "@statforge/claudestat@${VERSION}" version --prefer-online 2>/dev/null || true)"
            LATEST="$(npm view @statforge/claudestat version --prefer-online 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$VERSION" ] && [ "$LATEST" = "$VERSION" ]; then
              echo "npm $VERSION is published and latest=$LATEST"
              exit 0
            fi
            echo "attempt $i/12: $VERSION exists='$PUBLISHED' latest='$LATEST' (waiting up to 3 min for the registry)"
            sleep 15
          done
          echo "::error::npm latest is '$LATEST', expected $VERSION"
          exit 1

  release:
    name: Create GitHub Release
    needs: [binary, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: claudestat-*

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$VERSION]" 'index($0,hdr)==1{f=1;next} f && /^## \[/{exit} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
          body_path: ./release-notes.md
