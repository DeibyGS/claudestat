name: CI

on:
  push:
    branches: [main, 'release/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict)
        run: npx tsc --noEmit

  test:
    name: Test (${{ matrix.os }})
    needs: [lint]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  publish-check:
    name: Publish dry-run
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard
      - name: Validate NPM_TOKEN secret
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "❌ NPM_TOKEN is not set in repo secrets"
            exit 1
          fi
          echo "✅ NPM_TOKEN is set"
      - name: Dry-run publish (packaging check)
        run: npm publish --dry-run

  badge:
    name: Tests badge
    needs: [publish-check]
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Generate badge JSON artifact
        run: |
          mkdir -p badges
          cat > badges/tests.json << 'EOF'
          {
            "schemaVersion": 1,
            "label": "tests",
            "message": "passing",
            "color": "brightgreen"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: tests-badge
          path: badges/
